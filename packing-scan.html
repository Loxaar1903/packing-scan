<title>Packing Scan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Packing Scan">
<meta name="theme-color" content="#E8EBEE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — pallet list → pallet sheet (sticky scan bar) → packing list document */
:root{
  --bg:#E8EBEE; --surface:#F7F8F9; --ink:#17202B; --muted:#5B6673; --line:#C9CFD6;
  --accent:#E8590C; --accent-ink:#FFFFFF; --ok:#1F7A4D; --warn:#B4231A; --tag:#FFE8D9;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171D; --surface:#1B222A; --ink:#E6EAEE; --muted:#97A2AE; --line:#2E3842;
  --accent:#FF7A33; --accent-ink:#1A0D05; --ok:#4CC28A; --warn:#FF6B5E; --tag:#3A2416; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171D; --surface:#1B222A; --ink:#E6EAEE; --muted:#97A2AE; --line:#2E3842;
  --accent:#FF7A33; --accent-ink:#1A0D05; --ok:#4CC28A; --warn:#FF6B5E; --tag:#3A2416; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:6px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.ghost{background:transparent}
.btn svg{width:20px;height:20px;flex:none}
input[type=text]{font:inherit;width:100%;min-height:44px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 16px}
.topbar .sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 auto}

/* Pallet list */
.pallets{display:grid;gap:10px;margin-top:16px}
.pallet{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;width:100%}
.pallet .name{font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.pallet .meta{grid-column:1;color:var(--muted);font-size:13px}
.pallet .count{grid-row:1/3;grid-column:2;text-align:right}
.pallet .count b{display:block;font-family:var(--f-display);font-size:34px;line-height:1}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--tag);color:var(--accent);margin-left:6px;vertical-align:2px}
.chip.done{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px;margin-top:16px}

/* Pallet sheet */
.sheet-head{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:end;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.tally{text-align:right}
.tally b{display:block;font-family:var(--f-display);font-size:56px;line-height:.9;color:var(--accent)}
.fields{display:grid;gap:10px;margin-top:12px}
.fields label{display:grid;gap:4px}
.items{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:2.2em 1fr auto auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item .n{color:var(--muted);font-size:13px;text-align:right}
.item .code{min-width:0;overflow-wrap:anywhere;font-size:14px}
.item .time{color:var(--muted);font-size:12px}
.item.fresh{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--tag)}to{background:transparent}}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted)}
.icon-btn svg{width:20px;height:20px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.dock .inner{max-width:560px;margin:0 auto;display:flex;gap:8px}
.dock .btn.primary{flex:1;min-height:54px;font-size:17px}
.toolbar{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.overlay .inner{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
.viewfinder{position:relative;background:#000;border-radius:6px;overflow:hidden;aspect-ratio:3/4;max-height:56vh;width:100%;max-width:100%}
.viewfinder video{width:100%;height:100%;object-fit:cover;display:block}
.viewfinder .frame{position:absolute;inset:18% 12%;border:2px solid rgba(255,255,255,.85);border-radius:6px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.viewfinder .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;padding:24px;text-align:center}
.feedback{min-height:52px;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px}
.feedback.ok{border-color:var(--ok)}
.feedback.dup{border-color:var(--warn)}
.feedback .code{overflow-wrap:anywhere;min-width:0}
.feedback .state{font-weight:600;font-size:13px;white-space:nowrap}
.feedback.ok .state{color:var(--ok)} .feedback.dup .state{color:var(--warn)}
.fallback{display:grid;gap:10px;padding:14px;border:1px dashed var(--line);border-radius:6px}
.fallback p{margin:0;color:var(--muted);font-size:14px}
.big-count{font-family:var(--f-display);font-size:40px;font-weight:700;color:var(--accent);line-height:1}

/* Packing list document */
.doc{background:#fff;color:#111;border-radius:4px;padding:20px 18px;font-size:13px;border:1px solid var(--line)}
.doc h2{font-size:26px;color:#111}
.doc .hdr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin:14px 0 16px;padding:12px 0;border-top:2px solid #111;border-bottom:1px solid #111}
.doc .hdr div{min-width:0;overflow-wrap:anywhere}
.doc .hdr .k{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#555}
.doc .hdr .v{font-weight:600}
.doc-table{overflow-x:auto}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.doc th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#555;border-bottom:1px solid #111;padding:6px 4px}
.doc td{padding:6px 4px;border-bottom:1px solid #ddd;vertical-align:top}
.doc td.code{font-family:var(--f-mono);overflow-wrap:anywhere}
.doc .foot{display:flex;justify-content:space-between;margin-top:14px;font-weight:600}
.codeview{display:flex;flex-direction:column;align-items:center;gap:16px;background:#fff;color:#111;border-radius:6px;padding:24px 12px}
.codeview svg,.codeview canvas,.codeview img{max-width:100%;height:auto}
.codeview .txt{font-family:var(--f-mono);font-size:16px;overflow-wrap:anywhere;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:8px 14px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.confirm{display:grid;gap:8px;padding:12px;border:1px solid var(--warn);border-radius:6px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.item.fresh{animation:none}}
@media print{.dock,.no-print,.topbar{display:none!important}.wrap{padding:0}body{background:#fff}}
</style>

<div id="app" class="wrap"></div>
<div id="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<input id="photoInput" type="file" accept="image/*" capture="environment" hidden>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
const KEY='packingscan.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON={
  scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  code:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5v14M7 5v14M11 5v14M14 5v14M18 5v14M20 5v14"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ---------- state ---------- */
let state={pallets:[]};
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){state=JSON.parse(raw); return;}}catch(e){}
  // First launch: one example pallet, clearly labelled
  const now=Date.now();
  state={pallets:[{id:'ex',name:'Exemple',ref:'Démo — à supprimer',created:now-3600e3,closed:false,example:true,
    items:['R24-118-0031','R24-118-0032','R24-118-0035','R24-118-0036'].map((c,i)=>({code:c,t:now-3500e3+i*40e3}))}]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
const byId=id=>state.pallets.find(p=>p.id===id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtDate=t=>new Date(t).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtTime=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function nextName(){
  const nums=state.pallets.map(p=>parseInt(String(p.name).replace(/\D/g,''),10)).filter(n=>!isNaN(n));
  return 'Palette '+((nums.length?Math.max(...nums):0)+1);
}

let view={name:'home',id:null,confirm:null};
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  if(view.name==='home') app.innerHTML=homeHTML();
  else if(view.name==='pallet') app.innerHTML=palletHTML(byId(view.id));
  else if(view.name==='doc') app.innerHTML=docHTML(byId(view.id));
}
function homeHTML(){
  const ps=[...state.pallets].sort((a,b)=>b.created-a.created);
  const list=ps.length?`<div class="pallets">${ps.map(p=>`
    <button class="pallet" data-act="open" data-id="${p.id}">
      <span class="name">${esc(p.name)}${p.example?'<span class="chip">exemple</span>':''}${p.closed?'<span class="chip done">clôturée</span>':''}</span>
      <span class="count"><b class="mono">${p.items.length}</b><span class="label">rouleaux</span></span>
      <span class="meta">${fmtDate(p.created)}${p.ref?' · '+esc(p.ref):''}</span>
    </button>`).join('')}</div>`
    :`<div class="empty">Aucune palette. Crée-en une pour commencer à scanner les rouleaux.</div>`;
  return `<div class="topbar"><div><h1>Packing Scan</h1><div class="sub">${state.pallets.length} palette${state.pallets.length>1?'s':''} sur ce téléphone</div></div></div>
  ${list}
  <div class="dock"><div class="inner"><button class="btn primary" data-act="new">${ICON.plus} Nouvelle palette</button></div></div>`;
}
function palletHTML(p){
  if(!p){view={name:'home'};return homeHTML();}
  const items=p.items.map((it,i)=>`<li class="item${it.fresh?' fresh':''}">
      <span class="n mono">${i+1}</span>
      <span class="code mono">${esc(it.code)}</span>
      <button class="icon-btn" data-act="show" data-i="${i}" aria-label="Afficher le code ${esc(it.code)}">${ICON.code}</button>
      <button class="icon-btn" data-act="del" data-i="${i}" aria-label="Retirer ${esc(it.code)}">${ICON.x}</button>
    </li>`).reverse().join('');
  p.items.forEach(it=>delete it.fresh);
  const conf=view.confirm==='delete'?`<div class="confirm"><b>Supprimer « ${esc(p.name)} » et ses ${p.items.length} rouleaux ?</b><div class="row"><button class="btn danger" data-act="delPalletYes">Supprimer</button><button class="btn" data-act="cancelConfirm">Annuler</button></div></div>`:'';
  return `<div class="topbar no-print"><button class="btn ghost" data-act="home">${ICON.back} Palettes</button>
      <button class="btn ghost" data-act="toggleClose">${p.closed?'Rouvrir':'Clôturer'}</button></div>
    <div class="sheet-head">
      <div><div class="label">Palette</div><h2>${esc(p.name)}</h2><div class="note">${fmtDate(p.created)}${p.closed?' · clôturée':''}</div></div>
      <div class="tally"><b class="mono">${p.items.length}</b><span class="label">rouleaux</span></div>
    </div>
    <div class="fields">
      <label><span class="label">Nom / n° de palette</span><input id="f-name" type="text" value="${esc(p.name)}" data-field="name"></label>
      <label><span class="label">Référence (client, commande…)</span><input id="f-ref" type="text" value="${esc(p.ref||'')}" data-field="ref" placeholder="Optionnel"></label>
    </div>
    <div class="toolbar">
      <button class="btn" data-act="doc">Packing list</button>
      <button class="btn" data-act="csv">Exporter CSV</button>
      <button class="btn" data-act="copy">Copier la liste</button>
      <button class="btn danger" data-act="delPallet">Supprimer</button>
    </div>
    ${conf}
    ${p.items.length?`<ul class="items">${items}</ul>`:`<div class="empty">Aucun rouleau. Appuie sur « Scanner » et vise le code du premier rouleau.</div>`}
    ${p.closed?'':`<div class="dock"><div class="inner"><button class="btn primary" data-act="scan">${ICON.scan} Scanner</button></div></div>`}`;
}
function docHTML(p){
  if(!p){view={name:'home'};return homeHTML();}
  const rows=p.items.map((it,i)=>`<tr><td class="mono">${i+1}</td><td class="code">${esc(it.code)}</td><td class="mono">${fmtTime(it.t)}</td></tr>`).join('');
  return `<div class="topbar no-print"><button class="btn ghost" data-act="open" data-id="${p.id}">${ICON.back} Retour</button></div>
  <div class="doc">
    <h2>Packing list</h2>
    <div class="hdr">
      <div><div class="k">Palette</div><div class="v">${esc(p.name)}</div></div>
      <div><div class="k">Date</div><div class="v">${fmtDate(p.created)}</div></div>
      <div><div class="k">Référence</div><div class="v">${esc(p.ref||'—')}</div></div>
      <div><div class="k">Nombre de rouleaux</div><div class="v">${p.items.length}</div></div>
    </div>
    <div class="doc-table"><table><thead><tr><th>N°</th><th>Code rouleau</th><th>Heure scan</th></tr></thead><tbody>${rows||'<tr><td colspan="3">Aucun rouleau scanné.</td></tr>'}</tbody></table></div>
    <div class="foot"><span>Total</span><span>${p.items.length} rouleau${p.items.length>1?'x':''}</span></div>
  </div>
  <div class="toolbar no-print">
    <button class="btn primary" data-act="csv">Exporter CSV</button>
    <button class="btn" data-act="copy">Copier la liste</button>
    ${canPrint()?'<button class="btn" data-act="print">Imprimer / PDF</button>':''}
    ${navigator.share&&!inArtifact()?'<button class="btn" data-act="share">Partager</button>':''}
  </div>`;
}

/* ---------- exports ---------- */
function inArtifact(){try{return window.self!==window.top;}catch(e){return true;}}
function canPrint(){return !inArtifact();}
function listText(p){
  return `PACKING LIST — ${p.name}\nDate : ${fmtDate(p.created)}\n${p.ref?'Référence : '+p.ref+'\n':''}Rouleaux : ${p.items.length}\n\n`+p.items.map((it,i)=>`${i+1}\t${it.code}`).join('\n');
}
function csv(p){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[['Palette',p.name],['Date',fmtDate(p.created)],['Référence',p.ref||''],['Nombre de rouleaux',p.items.length],[],['N°','Code rouleau','Date scan','Heure scan']];
  p.items.forEach((it,i)=>lines.push([i+1,it.code,fmtDate(it.t),fmtTime(it.t)]));
  return '﻿'+lines.map(l=>l.map(q).join(';')).join('\r\n');
}
const fileName=p=>('packing-list_'+p.name+'_'+new Date(p.created).toISOString().slice(0,10)).replace(/[^\w\-]+/g,'_')+'.csv';
async function exportCSV(p){
  const data=csv(p), name=fileName(p);
  let dl=null;
  try{ if(window.claude&&window.claude.use) dl=await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{await dl.save({filename:name,data});toast('Fichier CSV enregistré');}
    catch(e){ if(e&&e.code==='declined') return; toast('Export impossible ici — utilise « Copier la liste »'); }
    return;
  }
  if(inArtifact()){toast('Export impossible ici — utilise « Copier la liste »');return;}
  const blob=new Blob([data],{type:'text/csv;charset=utf-8'});
  const file=new File([blob],name,{type:'text/csv'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return;}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function copyList(p){
  const txt=listText(p);
  const done=()=>toast('Liste copiée');
  try{navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt));}catch(e){fallbackCopy(txt);}
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();toast(ok?'Liste copiée':'Copie refusée par le navigateur');
}

/* ---------- scanning ---------- */
let reader=null, scanning=false, lastCode='', lastAt=0, audioCtx=null;
function beep(ok){
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=ok?1320:330;o.type='square';
    g.gain.value=.06;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(ok?.08:.25));}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(ok?60:[80,60,80]);}catch(e){}
}
function addCode(raw){
  const p=byId(view.id); if(!p) return;
  const code=String(raw).trim(); if(!code) return;
  const dup=p.items.some(it=>it.code===code);
  if(dup){beep(false);setFeedback(code,'dup');return;}
  if(p.example){p.example=false;}
  p.items.push({code,t:Date.now(),fresh:true});save();beep(true);setFeedback(code,'ok');
  const c=$('#scanCount');if(c)c.textContent=p.items.length;
}
function setFeedback(code,kind){
  const f=$('#feedback'); if(!f) return;
  f.className='feedback '+kind;
  f.innerHTML=`<span class="code mono">${esc(code)}</span><span class="state">${kind==='ok'?'✓ Ajouté':'Déjà sur la palette'}</span>`;
}
function hints(){
  const h=new Map();const F=ZXing.BarcodeFormat;
  h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.QR_CODE,F.CODE_128,F.DATA_MATRIX,F.CODE_39,F.EAN_13,F.ITF]);
  h.set(ZXing.DecodeHintType.TRY_HARDER,true);return h;
}
function openScanner(){
  const p=byId(view.id);
  const ov=$('#overlay');ov.hidden=false;ov.className='overlay';
  ov.innerHTML=`<div class="inner">
    <div class="topbar" style="padding:0"><div><div class="label">Scan en cours</div><h2>${esc(p.name)}</h2></div>
      <div style="text-align:right"><div id="scanCount" class="big-count mono">${p.items.length}</div><div class="label">rouleaux</div></div></div>
    <div class="viewfinder" id="vf"><video id="video" playsinline muted></video><div class="frame"></div><div class="msg" id="vfmsg">Démarrage de la caméra…</div></div>
    <div id="feedback" class="feedback"><span class="note">Vise le QR code d'un rouleau. Chaque code lu s'ajoute automatiquement.</span></div>
    <div class="fallback" id="fallback" hidden>
      <p>La caméra en direct n'est pas disponible dans cette vue. Prends une photo du code, une à une.</p>
      <button class="btn primary" data-act="photo">${ICON.scan} Photographier un code</button>
    </div>
    <form id="manual" class="row" autocomplete="off"><input id="manualInput" type="text" placeholder="Saisie manuelle du code" enterkeyhint="done"><button class="btn" type="submit" style="flex:0 0 auto">Ajouter</button></form>
    <button class="btn" data-act="closeScan">Terminer le scan</button>
  </div>`;
  startCamera();
}
async function startCamera(){
  const showFallback=()=>{const vf=$('#vf');if(vf)vf.hidden=true;const fb=$('#fallback');if(fb)fb.hidden=false;};
  if(typeof ZXing==='undefined'){showFallback();return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showFallback();return;}
  try{
    reader=new ZXing.BrowserMultiFormatReader(hints(),250);
    scanning=true;
    await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},'video',(res)=>{
      if(!res||!scanning) return;
      const code=res.getText(), now=Date.now();
      if(code===lastCode&&now-lastAt<2500) return;
      lastCode=code;lastAt=now;addCode(code);
    });
    const m=$('#vfmsg');if(m)m.hidden=true;
    try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
  }catch(e){stopCamera();showFallback();}
}
function stopCamera(){scanning=false;try{reader&&reader.reset();}catch(e){}reader=null;}
function closeScanner(){stopCamera();const ov=$('#overlay');ov.hidden=true;ov.innerHTML='';lastCode='';render();}
async function decodePhoto(file){
  if(typeof ZXing==='undefined'){toast('Lecteur de codes non chargé');return;}
  setFeedbackNote('Lecture de la photo…');
  const url=URL.createObjectURL(file);
  try{const r=new ZXing.BrowserMultiFormatReader(hints());const res=await r.decodeFromImageUrl(url);addCode(res.getText());}
  catch(e){setFeedbackNote('Aucun code trouvé sur la photo. Rapproche-toi et reprends-la bien nette.');beep(false);}
  finally{URL.revokeObjectURL(url);}
}
function setFeedbackNote(t){const f=$('#feedback');if(f){f.className='feedback';f.innerHTML=`<span class="note">${esc(t)}</span>`;}}

/* ---------- show code for re-scan on PC ---------- */
let codeMode='code128';
function showCode(code){
  const ov=$('#overlay');ov.hidden=false;ov.className='overlay';
  ov.innerHTML=`<div class="inner">
    <div class="topbar" style="padding:0"><h2>Code rouleau</h2><button class="btn ghost" data-act="closeOverlay">${ICON.x} Fermer</button></div>
    <div class="seg" role="group" aria-label="Format"><button data-act="mode" data-mode="code128" aria-pressed="${codeMode==='code128'}">Code 128</button><button data-act="mode" data-mode="qr" aria-pressed="${codeMode==='qr'}">QR code</button></div>
    <div class="codeview"><div id="codeHost"></div><div class="txt">${esc(code)}</div></div>
    <p class="note">Monte la luminosité de l'écran et présente-le au scanner du PC.</p>
  </div>`;
  ov.dataset.code=code;
  const host=$('#codeHost');
  try{
    if(codeMode==='qr'){new QRCode(host,{text:code,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});}
    else{host.innerHTML='<svg id="bc"></svg>';JsBarcode('#bc',code,{format:'CODE128',width:2.4,height:110,displayValue:false,margin:12,background:'#ffffff',lineColor:'#000000'});}
  }catch(e){host.innerHTML='<p class="note">Impossible de générer ce code.</p>';}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, p=byId(view.id);
  switch(act){
    case 'home': view={name:'home'};render();break;
    case 'open': view={name:'pallet',id:b.dataset.id};render();window.scrollTo(0,0);break;
    case 'new': {const np={id:uid(),name:nextName(),ref:'',created:Date.now(),closed:false,items:[]};state.pallets.push(np);save();view={name:'pallet',id:np.id};render();openScanner();break;}
    case 'scan': openScanner();break;
    case 'closeScan': closeScanner();break;
    case 'photo': $('#photoInput').click();break;
    case 'del': {const i=+b.dataset.i;const c=p.items[i].code;p.items.splice(i,1);save();render();toast('Retiré : '+c);break;}
    case 'show': showCode(p.items[+b.dataset.i].code);break;
    case 'mode': codeMode=b.dataset.mode;showCode($('#overlay').dataset.code);break;
    case 'closeOverlay': {const ov=$('#overlay');ov.hidden=true;ov.innerHTML='';break;}
    case 'doc': view={name:'doc',id:p.id};render();window.scrollTo(0,0);break;
    case 'csv': exportCSV(p);break;
    case 'copy': copyList(p);break;
    case 'print': window.print();break;
    case 'share': navigator.share({title:'Packing list '+p.name,text:listText(p)}).catch(()=>{});break;
    case 'toggleClose': p.closed=!p.closed;save();render();toast(p.closed?'Palette clôturée':'Palette rouverte');break;
    case 'delPallet': view.confirm='delete';render();break;
    case 'cancelConfirm': view.confirm=null;render();break;
    case 'delPalletYes': state.pallets=state.pallets.filter(x=>x.id!==p.id);save();view={name:'home'};render();toast('Palette supprimée');break;
  }
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.field; if(!f) return;
  const p=byId(view.id); if(!p) return; p[f]=e.target.value; p.example=false; save();
  if(f==='name'){const h=document.querySelector('.sheet-head h2');if(h)h.textContent=p.name;}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='manual') return; e.preventDefault();
  const i=$('#manualInput'); addCode(i.value); i.value=''; i.focus();
});
$('#photoInput').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)decodePhoto(f);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scanning)closeScanner();});

load();render();
})();
</script>
